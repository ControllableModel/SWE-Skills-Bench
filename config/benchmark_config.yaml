  - batch1
  - batch2
  - batch3
  - batch4
  - batch5
  - batch6
  - batch7
  - batch8
  - batch9
  - batch10
  active_batch: batch1
  network_mode: bridge
  container_backend: enroot
skills:
- id: add-uint-support
  name: Add UInt Support
  description: Restore uint32/uint64 operator support in PyTorch
  type: repair
  repo:
    url: null
    commit: null
    sparse_checkout: []
  environment:
    base_image: zhangyiiiiii/swe-skills-bench-pytorch:latest
    dockerfile: ''
    build_context: ''
    build_args: {}
    limits:
      max_iterations: 1
      total_timeout_sec: 1800
    env_vars: {}
    setup_commands: []
    pre_process: null
    evaluation:
    - level: L1
      method: build_check
      enabled: true
      params:
        build_command: cd pytorch && MAX_JOBS=4 USE_CUDA=0 python setup.py develop
        expected_exit_code: 0
        timeout: 3600
    - level: L2
      method: unit_test
      enabled: true
      params:
        test_command: python -m pytest /workspace/tests/test_add_uint_support.py -v --tb=short
        min_pass_rate: 0.5
        timeout: 600
